<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<style>
/* Interfaz oscura, compacta, pensada primero para teléfono. */
:root {
  --bg: #0c121d; --surface: #16203f; --surface-2: #111a2e; --line: #2a3a63;
  --text: #f1f4fb; --muted: #a6b2cf; --ok: #5fd6a3; --warn: #f5c04a; --bad: #ff7a7a;
  --accent: #f0a43c; --accent-ink: #1b1204;
  --c-blue: #3f6786; --c-green: #4f7238; --c-amber: #7a6a3a; --c-sky: #35627f; --c-red: #7a3347; --c-teal: #2b5a60;
  --radius: 20px; --gap: 12px; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; min-height: 100dvh; }
.app { max-width: 480px; margin: 0 auto;
  padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
h1, h2 { margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: 1.5rem; } h2 { font-size: 1.05rem; margin-top: 4px; }
a { color: inherit; }
.loading, .empty { color: var(--muted); text-align: center; padding: 24px 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--warn); outline-offset: 2px; }
.screen { display: flex; flex-direction: column; gap: var(--gap); }
.panel { background: var(--surface); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.meta { margin: 0; color: var(--muted); font-size: .9rem; }
.center { text-align: center; }
.home-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 4px 4px 0; }
.cats { margin: 4px 0 0; color: var(--muted); font-size: .92rem; }
.clock { color: var(--muted); font-size: 1.1rem; padding-top: 6px; font-variant-numeric: tabular-nums; }
.progress-row { display: flex; justify-content: space-between; color: var(--muted); }
.progress-row .count { color: var(--ok); font-weight: 600; }
.bar { height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--ok); border-radius: 6px; transition: width .3s; }
.start-panel p { margin: 0; color: var(--muted); }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }
.card { border-radius: var(--radius); background: var(--card, var(--c-blue)); display: flex; flex-direction: column; min-width: 0; box-shadow: inset 0 0 0 3px transparent; }
.c-blue { --card: var(--c-blue); } .c-green { --card: var(--c-green); } .c-amber { --card: var(--c-amber); }
.c-sky { --card: var(--c-sky); } .c-red { --card: var(--c-red); } .c-teal { --card: var(--c-teal); }
.card-main { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 2px;
  padding: 14px 14px 12px; min-height: 124px; flex: 1; border-radius: var(--radius); min-width: 0; }
.card-main:focus-visible { outline: 3px solid var(--warn); outline-offset: -3px; }
.card-main:disabled { cursor: default; opacity: .6; }
.card-icon { font-size: 1.5rem; line-height: 1; }
.card-name { font-weight: 700; font-size: 1.05rem; margin-top: 6px; overflow-wrap: anywhere; }
.card-limit { font-size: .85rem; color: rgba(255,255,255,.85); }
.card-status { margin-top: auto; padding-top: 8px; font-weight: 700; font-size: .95rem; font-variant-numeric: tabular-nums; }
.card[data-phase="running"] { box-shadow: inset 0 0 0 3px var(--ok); }
.card[data-phase="done"] { box-shadow: inset 0 0 0 3px rgba(95,214,163,.55); }

.group { display: flex; flex-direction: column; gap: 8px; }
.group-title { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 4px 0; font-size: 1.05rem; letter-spacing: .02em; }
.group-count { color: var(--muted); font-size: .9rem; font-weight: 500; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; border-radius: 16px; background: var(--card, var(--c-blue)); }
.prow-main { padding: 10px 6px 10px 14px; min-height: 64px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
.prow-sub { font-size: .85rem; font-weight: 500; color: rgba(255,255,255,.88); font-variant-numeric: tabular-nums; }
.prow { box-shadow: inset 0 0 0 3px transparent; }
.prow[data-phase="running"] { box-shadow: inset 0 0 0 3px var(--ok); }
.prow-act { grid-column: 1 / -1; display: flex; gap: 8px; padding: 0 10px 10px; }
.prow-act .btn { min-height: 48px; flex: 1; }
.prow-act .btn-cancel { flex: none; min-width: 56px; }
.step-count small { display: block; font-size: .7rem; font-weight: 500; opacity: .9; }
.prow.is-empty .prow-main { opacity: .8; }
.stepper { display: flex; align-items: center; gap: 4px; padding: 0 10px 0 0; }
.step { all: unset; box-sizing: border-box; cursor: pointer; width: 46px; height: 46px; border-radius: 14px; text-align: center;
  background: rgba(8,12,24,.45); font-size: 1.5rem; font-weight: 700; line-height: 46px; color: var(--text); }
.step:disabled { opacity: .35; cursor: default; }
.step:focus-visible { outline: 3px solid var(--warn); }
.step-count { all: unset; box-sizing: border-box; cursor: pointer; min-width: 58px; min-height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; text-align: center;
  border-radius: 12px; font-size: 1.4rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.step-count:disabled { cursor: default; opacity: .6; }

.btn { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; gap: 8px;
  min-height: 52px; padding: 10px 16px; border-radius: 16px; font-weight: 700; background: var(--c-blue); color: #fff; }
.btn:focus-visible { outline: 3px solid var(--warn); outline-offset: 2px; }
.btn-big { min-height: 64px; font-size: 1.15rem; }
.btn-wide { width: 100%; }
.btn-primary { background: #2f7f6c; } .btn-ok { background: #2d8266; }
.btn-accent { background: var(--accent); color: var(--accent-ink); }
.btn-danger { background: #a63a3a; }
.btn-ghost { background: transparent; box-shadow: inset 0 0 0 2px var(--line); color: var(--muted); font-weight: 600; }
.btn-warnline { color: #ffd9a0; box-shadow: inset 0 0 0 2px #7d5a22; }
.btn-danger-line { color: #ffb4b4; box-shadow: inset 0 0 0 2px #7d3030; }
.nav { display: flex; flex-direction: column; gap: var(--gap); }
.nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
.chip { all: unset; cursor: pointer; padding: 6px 12px; border-radius: 999px; box-shadow: inset 0 0 0 2px var(--line); color: var(--muted); font-size: .85rem; }
.iconbtn { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: var(--surface); text-decoration: none; font-size: 1.3rem; flex: none; }
.topbar { display: flex; align-items: center; gap: 12px; }

.time-panel { align-items: stretch; padding: 22px 16px; gap: 6px; }
.time-panel h1 { text-align: center; }
.time-big { text-align: center; font-size: clamp(2.6rem, 16vw, 4rem); font-weight: 800; line-height: 1.1; color: var(--ok); font-variant-numeric: tabular-nums; }
.time-panel[data-phase="pending"] .time-big, .time-panel[data-phase="done"] .time-big { color: var(--text); }
.time-label { text-align: center; font-weight: 700; letter-spacing: .08em; font-size: .85rem; color: var(--muted); }
.time-sub { text-align: center; color: var(--muted); font-size: .95rem; min-height: 1.4em; }
.actions { display: flex; flex-direction: column; gap: var(--gap); margin-top: 14px; }
.runs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.runs li { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; border-radius: 12px; background: var(--surface-2); font-variant-numeric: tabular-nums; }
.run-muted { color: var(--muted); }

.log-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.log { list-style: none; margin: 0; padding: 12px; border-radius: 16px; background: var(--surface-2); display: flex; flex-direction: column; gap: 10px; max-height: 55dvh; overflow-y: auto; }
.log li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; }
.log time { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.log-text { overflow-wrap: anywhere; }
.log-ok strong { color: var(--ok); } .log-warn strong { color: var(--warn); } .log-bad strong { color: var(--bad); }
.history { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.history a { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); text-decoration: none; min-height: 52px; }
.history span { color: var(--muted); font-size: .9rem; }

.form label { color: var(--muted); font-size: .9rem; }
.form input[type="text"], .form input[type="number"], .form select {
  width: 100%; min-height: 48px; padding: 8px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface-2); color: var(--text); font: inherit; }
.form .check { display: flex; align-items: center; gap: 10px; color: var(--text); }
.form .check input { width: 24px; height: 24px; flex: none; }
.days { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.days legend { color: var(--muted); font-size: .9rem; padding: 0 0 6px; }
.day { position: relative; }
.day input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.day span { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line); color: var(--muted); font-weight: 700; }
.day input:checked + span { background: var(--c-blue); border-color: var(--c-blue); color: #fff; }
.day input:focus-visible + span { outline: 3px solid var(--warn); }
.edit-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.edit-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; background: var(--surface-2); border-radius: 14px; padding: 4px 8px 4px 0; }
.edit-main { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; text-decoration: none; min-height: 56px; justify-content: center; }
.edit-main span { color: var(--muted); font-size: .85rem; }
.edit-move { display: flex; gap: 6px; }
.edit-move .step { background: var(--surface); }

.banner { padding: 10px 14px; border-radius: 14px; margin-bottom: var(--gap); font-size: .92rem; }
.banner-bad { background: #4a1f26; color: #ffd0d0; }
.toasts { position: fixed; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 16px; pointer-events: none; z-index: 20; }
.toast { background: #202c52; color: var(--text); padding: 12px 16px; border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.5); max-width: 440px; font-weight: 600; }
.toast-ok { box-shadow: inset 0 0 0 2px var(--ok), 0 6px 20px rgba(0,0,0,.5); }
.toast-warn { box-shadow: inset 0 0 0 2px var(--warn), 0 6px 20px rgba(0,0,0,.5); }
.toast-bad { box-shadow: inset 0 0 0 2px var(--bad), 0 6px 20px rgba(0,0,0,.5); }
.dialog { border: 0; border-radius: var(--radius); background: var(--surface); color: var(--text); padding: 20px; width: min(92vw, 420px); }
.dialog::backdrop { background: rgba(0,0,0,.65); }
.dialog p { color: var(--muted); }
.dialog-actions { display: flex; gap: var(--gap); margin-top: 8px; }
.dialog-actions .btn { flex: 1; }
.dialog-actions .dlg-first { order: 2; }
.num-input { width: 100%; min-height: 56px; font: inherit; font-size: 1.5rem; text-align: center; border-radius: 12px; border: 2px solid var(--line); background: var(--surface-2); color: var(--text); }
.cust-bar { all: unset; box-sizing: border-box; cursor: pointer; display: block; width: 100%; padding: 14px 16px; min-height: 56px; border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 2px var(--line); font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
.cust-bar.on { background: #5a4a86; box-shadow: inset 0 0 0 3px #b9a7ff; }
.cust-bar:focus-visible { outline: 3px solid var(--warn); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app" class="app"><p class="loading">Cargando…</p></div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<dialog id="confirm" class="dialog">
  <form method="dialog">
    <h2 id="confirm-title"></h2>
    <p id="confirm-text"></p>
    <div class="dialog-actions">
      <button type="submit" value="cancel" class="btn btn-ghost">Cancelar</button>
      <button type="submit" value="ok" class="btn btn-primary" id="confirm-yes">Aceptar</button>
    </div>
  </form>
</dialog>
<dialog id="number-dialog" class="dialog">
  <form method="dialog">
    <h2 id="number-title"></h2>
    <p id="number-text"></p>
    <label class="sr" for="number-input">Cantidad</label>
    <input id="number-input" class="num-input" type="number" inputmode="numeric" min="0" max="999" step="1">
    <div class="dialog-actions">
      <button type="submit" value="ok" class="btn btn-primary dlg-first">Aceptar</button>
      <button type="submit" value="cancel" class="btn btn-ghost" formnovalidate>Cancelar</button>
    </div>
  </form>
</dialog>
<noscript>Esta aplicación necesita JavaScript.</noscript>

<script>
/* Formato de horas y duraciones (sin dependencias). */
(function (global) {
  'use strict';
  const T = (global.Turnos = global.Turnos || {});
  const pad = (n) => String(n).padStart(2, '0');
  const clock = (ts) => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const time = (ts) => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
  const dateISO = (ts) => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const dateTime = (ts) => `${dateISO(ts)} ${clock(ts)}`;
  /** ms -> "15 min" / "1 h 05 min" (redondea al minuto más cercano). */
  function dur(ms) {
    const m = Math.round(Math.max(0, ms) / 60000);
    if (m < 1) return '<1 min';
    if (m < 60) return `${m} min`;
    return `${Math.floor(m / 60)} h ${pad(m % 60)} min`;
  }
  T.Format = { pad, clock, time, dateISO, dateTime, dur };
})(window);

/* Configuración: actividades editables y ajustes generales. */
(function (global) {
  'use strict';
  const T = (global.Turnos = global.Turnos || {});

  const SCHEMA_VERSION = 4;
  const KINDS = { once: 'Una vez por turno', multi: 'Varias veces por turno', pallet: 'Tarimas (contador y tiempo)' };
  const COLORS = { blue: 'Azul', green: 'Verde', amber: 'Ámbar', sky: 'Celeste', red: 'Rojo', teal: 'Verde azulado' };
  const DAY_LABELS = [['1', 'L'], ['2', 'M'], ['3', 'X'], ['4', 'J'], ['5', 'V'], ['6', 'S'], ['0', 'D']];

  const act = (id, name, group, kind, icon, color, extra) => ({ id, name, group, kind, icon, color, days: [], optional: false, ...(extra || {}) });
  const GP = 'Tarimas por guardar';
  // Actividades añadidas por versión (se agregan solas a quien ya tenía la lista anterior, una sola vez).
  const ADDED = { 2: ['sacar-reciclado', 'limpieza-bodega', 'descanso', 'ley-silla', 'banos'], 3: ['banos'] };

  const DEFAULT_SETTINGS = {
    schemaVersion: SCHEMA_VERSION,
    areaName: 'ÁREA 1',
    categories: ['Perecederos', 'Aves', 'Carnes', 'Pescadería', 'Lácteos', 'Congelados'],
    activities: [
      act('surtido-exh-huevo', 'Surtido exhibición de huevo', 'Surtido', 'once', '🥚', 'amber'),
      act('surtido-exh-leche', 'Surtido exhibición de leche', 'Surtido', 'once', '🥛', 'sky'),
      act('surtido-pasillo', 'Surtido pasillo', 'Surtido', 'once', '🛒', 'blue'),
      act('surtido-devoluciones', 'Surtido devoluciones', 'Surtido', 'once', '↩️', 'teal'),
      act('surtido-lacteos', 'Surtido lácteos', 'Surtido', 'once', '🧈', 'sky'),
      act('frenteo-congelados', 'Frenteo de congelados', 'Frenteo y ofertas', 'once', '🧊', 'green'),
      act('ofertas', 'Colocación de ofertas y rótulos', 'Frenteo y ofertas', 'once', '🏷️', 'red', { days: [1, 4] }),
      act('taurus', 'Descarga de Taurus', 'Camión', 'multi', '🚛', 'blue', { optional: true }),
      act('reciclado', 'Carga de reciclado', 'Camión', 'multi', '♻️', 'green', { optional: true }),
      act('sacar-reciclado', 'Sacar reciclado', 'Camión', 'multi', '🗑️', 'teal', { optional: true }),
      act('limpieza-bodega', 'Limpieza de bodega', 'Bodega', 'once', '🧹', 'sky', { optional: true }),
      act('conteo-plan', 'Conteo de tarimas y plan', 'Plan', 'once', '🧮', 'teal'),
      act('descanso', 'Descanso', 'Personal', 'multi', '☕', 'blue', { optional: true }),
      act('ley-silla', 'Ley silla', 'Personal', 'multi', '🪑', 'amber', { optional: true }),
      act('banos', 'Ida al baño', 'Personal', 'multi', '🚻', 'sky', { optional: true }),
      act('pal-cocina', 'Cocina', GP, 'pallet', '🍳', 'amber'),
      act('pal-aves', 'Aves', GP, 'pallet', '🍗', 'red'),
      act('pal-carnes', 'Carnes', GP, 'pallet', '🥩', 'red'),
      act('pal-salchi', 'Salchichonería', GP, 'pallet', '🌭', 'red'),
      act('pal-lacteos', 'Lácteos', GP, 'pallet', '🥛', 'sky'),
      act('pal-pan', 'Pan', GP, 'pallet', '🍞', 'amber'),
      act('pal-congelados', 'Congelados', GP, 'pallet', '🧊', 'teal'),
      act('pal-leche-hut', 'Leche Hut', GP, 'pallet', '🥛', 'blue'),
      act('pal-huevo', 'Huevo', GP, 'pallet', '🥚', 'amber'),
      act('pal-pescaderia', 'Pescadería', GP, 'pallet', '🐟', 'teal'),
      act('pal-proveduria', 'Proveeduría', GP, 'pallet', '📦', 'blue'),
      act('pal-tortilleria', 'Tortillería', GP, 'pallet', '🫓', 'green'),
      act('pal-panaderia', 'Panadería', GP, 'pallet', '🥐', 'amber'),
    ],
  };

  const clone = (o) => structuredClone(o);
  const newId = () => `a-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 5)}`;
  const displayName = (def) => (def.kind === 'pallet' && !/^tarima/i.test(def.name) ? `Tarima ${def.name}` : def.name);
  const isScheduled = (def, ts) => !def.days || !def.days.length || def.days.includes(new Date(ts).getDay());

  function sanitizeActivity(raw, usedIds) {
    if (!raw || typeof raw !== 'object') return null;
    const name = String(raw.name || '').trim().slice(0, 40);
    if (!name) return null;
    let id = String(raw.id || '').trim();
    if (!/^[a-zA-Z0-9_-]{1,48}$/.test(id) || (usedIds && usedIds.has(id))) id = newId();
    const days = Array.isArray(raw.days) ? [...new Set(raw.days.map(Number).filter((n) => Number.isInteger(n) && n >= 0 && n <= 6))].sort() : [];
    return {
      id, name,
      group: String(raw.group || '').trim().slice(0, 30) || 'Otras actividades',
      kind: KINDS[raw.kind] ? raw.kind : 'once',
      icon: String(raw.icon || '').trim().slice(0, 8) || '•',
      color: COLORS[raw.color] ? raw.color : 'blue',
      days: days.length === 7 ? [] : days,
      optional: !!raw.optional,
    };
  }

  /** Valida ajustes leídos de disco o del formulario. Migra la lista de la versión 2 conservando tus cambios. */
  function sanitize(raw) {
    const out = clone(DEFAULT_SETTINGS);
    if (!raw || typeof raw !== 'object') return out;
    if (typeof raw.areaName === 'string' && raw.areaName.trim()) out.areaName = raw.areaName.trim().slice(0, 40);
    if (Array.isArray(raw.categories)) out.categories = raw.categories.map((s) => String(s).trim()).filter(Boolean).slice(0, 20);
    if ([2, 3, SCHEMA_VERSION].includes(raw.schemaVersion) && Array.isArray(raw.activities)) {
      const used = new Set();
      const list = raw.activities.map((a) => {
        if (a && a.id === 'reciclado' && a.name === 'Reciclado (llenar tráiler)') a = { ...a, name: 'Carga de reciclado' };
        const d = sanitizeActivity(a, used);
        if (d) used.add(d.id);
        return d;
      }).filter(Boolean);

    }

    }

    constructor() { this.name = 'memory'; this.persistent = false; this.settings = null; this.shifts = new Map(); this.events = new Map(); }

      if (settings) this.settings = structuredClone(settings);
    }
  }

  const DAYS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const dateLong = (ts) => { const d = new Date(ts); return `${DAYS[d.getDay()]} ${d.getDate()} de ${MONTHS[d.getMonth()]} de ${d.getFullYear()}`; };

  /** Actividades en orden cronológico; la atención al cliente se anida en la actividad en curso, o queda suelta. */
  function timeline(shift) {
    const items = [];
    for (const def of shift.config.activities) {
      const A = shift.activities[def.id];
      if (!A) continue;
      A.runs.filter((r) => r.outcome === 'done' && !r.superseded).forEach((r) => items.push({ icon: def.icon, name: nm(def), startedAt: r.startedAt, endedAt: r.endedAt, customers: [] }));
      if (A.status === 'running' && A.runStartedAt) items.push({ icon: def.icon, name: nm(def), startedAt: A.runStartedAt, endedAt: null, customers: [] });
    }

    const loose = [];
    [...(shift.customers || [])].sort((a, b) => a.startedAt - b.startedAt).forEach((c) => {

      .filter((d) => d.kind === 'pallet' && shift.activities[d.id] && shift.activities[d.id].received > 0)

      if (e.i) {
        L.push(`${e.i.icon} ${e.i.name}`, `     ${range(e.i.startedAt, e.i.endedAt)}`);

    });
    loose.forEach((c) => rows.push({ at: c.startedAt, name: 'Atención al cliente', during: '', s: c.startedAt, e: c.endedAt }));

    return h('ol', { class: 'log' }, list.map((e) => {
      const m = Log.meta(e.type);
      return h('li', { class: `log-${m.tone}` },
        h('time', { datetime: new Date(e.ts).toISOString() }, F.time(e.ts)),
        h('span', { class: 'log-text' }, h('span', { 'aria-hidden': 'true' }, `${m.icon} `), h('strong', {}, m.label), e.parts.length ? ` · ${e.parts.join(' · ')}` : ''));
    }));
  }

  function viewLog({ shift, events, closed, back }) {
    const title = closed ? `📋 Turno ${F.dateISO(shift.startedAt)}` : '📋 Bitácora';
    const d = { closed: closed ? '1' : '', shift: shift ? shift.id : '' };
    return h('main', { class: 'screen' }, topbar(title, { back }),
      h('section', { class: 'panel' },
        h('div', { class: 'log-head' },
          h('span', { class: 'meta' }, `${events.length} evento(s)${closed ? ' · turno cerrado' : ''}`),
          h('button', { class: 'chip', type: 'button', dataset: { action: 'toggle-order' } }, logNewestFirst ? '↓ Recientes primero' : '↑ Antiguos primero')),
        logList(events),
        shift ? h('button', { class: 'btn btn-accent btn-big', type: 'button', dataset: { action: 'export', format: 'txt', ...d } }, '📄 Exportar reporte (txt)') : null,
        shift ? h('button', { class: 'btn btn-ghost', type: 'button', dataset: { action: 'export', format: 'csv', ...d } }, '📊 Exportar tiempos (csv para Excel)') : null,
        shift ? h('button', { class: 'btn btn-ghost', type: 'button', dataset: { action: 'copy-report', ...d } }, 'Copiar texto del reporte') : null,
        h('a', { class: 'btn btn-ghost', href: back }, '← Volver')));
  }

  async function viewHistory() {
    const shifts = await Store.loadHistory();
    return h('main', { class: 'screen' }, topbar('🕘 Historial'),
      h('section', { class: 'panel' },
        shifts.length ? h('ul', { class: 'history' }, shifts.map((s) =>
          h('li', {}, h('a', { href: `#/historial/${s.id}` }, h('strong', {}, F.dateISO(s.startedAt)), h('span', {}, `${F.clock(s.startedAt)}–${s.endedAt ? F.clock(s.endedAt) : '…'}`))))) : h('p', { class: 'empty' }, 'Todavía no hay turnos finalizados.')));
  }

  async function viewClosedShift(id) {
    const data = await Store.loadClosedShift(id);
    if (!data) return h('main', { class: 'screen' }, topbar('Turno', { back: '#/historial' }), h('p', { class: 'empty' }, 'No se encontró el turno.'));
    return viewLog({ shift: data.shift, events: data.events, closed: true, back: '#/historial' });
  }

  function viewSettings() {
    const s = state.settings;
    const form = h('form', { class: 'panel form', id: 'settings-form' },
      h('label', { for: 'f-area' }, 'Nombre del área'),
      h('input', { id: 'f-area', name: 'area', type: 'text', maxlength: '40', value: s.areaName, required: true }),
      h('label', { for: 'f-cats' }, 'Categorías (separadas por coma)'),
      h('input', { id: 'f-cats', name: 'cats', type: 'text', value: s.categories.join(', ') }),
      h('button', { class: 'btn btn-primary btn-big', type: 'submit' }, 'Guardar ajustes'));
    const diag = h('section', { class: 'panel' }, h('h2', {}, 'Estado técnico'),
      h('p', { class: 'meta' }, state.storage.persistent ? 'Guardado local en IndexedDB.' : `ATENCIÓN: sin almacenamiento persistente (${state.storage.fallbackReason || 'motivo desconocido'}). Los datos se pierden al cerrar.`));
    return h('main', { class: 'screen' }, topbar('⚙ Ajustes'), h('a', { class: 'btn btn-wide', href: '#/actividades' }, '✏️ Editar actividades'), form, diag);
  }

  function viewActivities() {
    const groups = new Map();
    state.settings.activities.forEach((d) => { if (!groups.has(d.group)) groups.set(d.group, []); groups.get(d.group).push(d); });
    const sections = [...groups].map(([name, defs]) => h('section', { class: 'panel' }, h('h2', {}, name),
      h('ul', { class: 'edit-list' }, defs.map((d, i) => h('li', {},
        h('a', { class: 'edit-main', href: `#/editar/${encodeURIComponent(d.id)}` },
          h('strong', {}, `${d.icon} ${d.name}`),
          h('span', {}, `${Config.KINDS[d.kind]} · ${daysText(d)}${d.optional ? ' · opcional' : ''}`)),
        h('div', { class: 'edit-move' },
          h('button', { class: 'step', type: 'button', disabled: i === 0, 'aria-label': `Subir ${d.name}`, dataset: { action: 'move-up', id: d.id } }, '↑'),
          h('button', { class: 'step', type: 'button', disabled: i === defs.length - 1, 'aria-label': `Bajar ${d.name}`, dataset: { action: 'move-down', id: d.id } }, '↓')))))));
    return h('main', { class: 'screen' }, topbar('✏️ Actividades', { back: '#/ajustes' }),
      h('a', { class: 'btn btn-primary btn-big', href: '#/editar/nueva' }, '＋ Nueva actividad'),
      sections.length ? sections : h('p', { class: 'empty' }, 'No hay actividades. Agrega la primera.'),
      h('p', { class: 'meta' }, 'Las actividades eliminadas se quitan de la pantalla principal; lo ya registrado en turnos e historial se conserva.'));
  }

  function viewEditActivity(id) {
    const isNew = id === 'nueva';
    const d = isNew ? { id: '', name: '', group: '', kind: 'once', icon: '🧹', color: 'blue', days: [], optional: false } : state.settings.activities.find((x) => x.id === id);
    if (!d) return h('main', { class: 'screen' }, topbar('Actividad', { back: '#/actividades' }), h('p', { class: 'empty' }, 'No se encontró la actividad.'));
    const groups = [...new Set(state.settings.activities.map((x) => x.group))];
    const emojis = ['🧹', '🛒', '🥚', '🥛', '🧈', '🧊', '🏷️', '🪧', '🚛', '♻️', '🗑️', '🧮', '☕', '🪑', '🍳', '🍗', '🥩', '🌭', '🍞', '🐟', '📦', '🫓', '🥐', '🍎', '🧴', '↩️'];
    return h('main', { class: 'screen' }, topbar(isNew ? 'Nueva actividad' : 'Editar actividad', { back: '#/actividades' }),
      h('form', { class: 'panel form', id: 'activity-form', dataset: { activityId: d.id } },
        h('label', { for: 'a-name' }, 'Nombre'),
        h('input', { id: 'a-name', name: 'name', type: 'text', maxlength: '40', value: d.name, required: true }),
        h('label', { for: 'a-group' }, 'Grupo (aparece como sección en la pantalla principal)'),
        h('input', { id: 'a-group', name: 'group', type: 'text', maxlength: '30', value: d.group, list: 'a-groups', placeholder: 'Otras actividades' }),
        h('datalist', { id: 'a-groups' }, groups.map((g) => h('option', { value: g }))),
        h('label', { for: 'a-kind' }, 'Tipo'),
        h('select', { id: 'a-kind', name: 'kind' }, Object.entries(Config.KINDS).map(([k, label]) => h('option', { value: k, selected: d.kind === k }, label))),
        h('p', { class: 'meta' }, 'Una vez: surtido, frenteo. Varias veces: descanso, Taurus, sacar reciclado. Tarimas: cuenta las tarimas del departamento y mide cada una.'),
        h('label', { for: 'a-icon' }, 'Icono (un emoji)'),
        h('input', { id: 'a-icon', name: 'icon', type: 'text', maxlength: '8', value: d.icon, list: 'a-emojis' }),
        h('datalist', { id: 'a-emojis' }, emojis.map((e) => h('option', { value: e }))),
        h('label', { for: 'a-color' }, 'Color'),
        h('select', { id: 'a-color', name: 'color' }, Object.entries(Config.COLORS).map(([k, label]) => h('option', { value: k, selected: d.color === k }, label))),
        h('fieldset', { class: 'days' }, h('legend', {}, 'Días en que toca (ninguno marcado = todos)'),
          Config.DAY_LABELS.map(([n, l]) => h('label', { class: 'day', for: `a-day-${n}` }, h('input', { id: `a-day-${n}`, name: `day-${n}`, type: 'checkbox', checked: d.days.includes(Number(n)) }), h('span', {}, l)))),
        h('label', { class: 'check', for: 'a-opt' }, h('input', { id: 'a-opt', name: 'optional', type: 'checkbox', checked: d.optional }), 'Opcional: no cuenta en el avance del turno'),
        h('button', { class: 'btn btn-primary btn-big', type: 'submit' }, 'Guardar'),
        isNew ? null : h('button', { class: 'btn btn-ghost btn-danger-line', type: 'button', dataset: { action: 'delete-activity', id: d.id } }, '🗑 Eliminar actividad')));
  }

  function viewBlocked() {
    return h('main', { class: 'screen' }, h('section', { class: 'panel' }, h('h1', {}, 'App abierta en otra ventana'),
      h('p', {}, 'Para evitar datos duplicados, solo puede haber una ventana activa. Cierra la otra o continúa en ella.'),
      h('button', { class: 'btn btn-primary', type: 'button', onclick: () => location.reload() }, 'Reintentar')));
  }

  // ---------- render y rutas ----------
  function parseRoute() {
    const parts = (location.hash || '#/').replace(/^#\/?/, '').split('/').filter(Boolean);
    return { name: parts[0] || 'home', arg: parts[1] ? decodeURIComponent(parts[1]) : null };
  }

  function mount(content) {
    const banners = [];
    if (state.storage.error) banners.push(h('div', { class: 'banner banner-bad', role: 'alert' }, 'No se pudo guardar en el dispositivo. Se reintentará con el siguiente cambio; no cierres la app.'));
    else if (state.ready && !state.storage.persistent) banners.push(h('div', { class: 'banner banner-bad', role: 'alert' }, 'Sin almacenamiento persistente: los datos se perderán al cerrar la app.'));
    root.replaceChildren(...banners, content);
  }

  async function render() {
    if (!root) return;
    const token = ++renderToken;
    const route = parseRoute();
    const key = `${route.name}/${route.arg || ''}`;
    const y = global.scrollY;
    let content;
    if (!state.ready) content = h('p', { class: 'loading' }, 'Cargando…');
    else if (route.name === 'actividad') content = viewActivity(route.arg);
    else if (route.name === 'bitacora') content = viewLog({ shift: state.shift, events: state.events, closed: false, back: '#/' });
    else if (route.name === 'ajustes') content = viewSettings();
    else if (route.name === 'actividades') content = viewActivities();
    else if (route.name === 'editar') content = viewEditActivity(route.arg);
    else if (route.name === 'historial') content = route.arg ? await viewClosedShift(route.arg) : await viewHistory();
    else content = viewHome();
    if (token !== renderToken) return;
    mount(content);
    global.scrollTo(0, key === lastRouteKey ? y : 0);
    lastRouteKey = key;
  }

  function updateLive() {
    if (!state.ready) return;
    for (const el of document.querySelectorAll('[data-live="clock"]')) el.textContent = F.clock(Date.now());
  }

  // ---------- eventos ----------
  async function onClick(ev) {
    const btn = ev.target.closest('[data-action]');
    if (!btn || btn.disabled) return;
    const { action, id } = btn.dataset;
    const report = (r) => { if (r && !r.ok && r.reason) toast(r.reason, 'warn'); return r; };
    switch (action) {
      case 'start-shift': report(Store.startShift()); break;
      case 'end-shift': {
        const n = Store.runningCount();
        const okay = await confirmDialog({ title: '¿Finalizar el turno?', message: n ? `Hay ${n} actividad(es) en curso: se cerrarán con la hora de fin del turno. El turno pasará al historial.` : 'El turno pasará al historial y podrás exportarlo desde ahí.', confirmText: 'Finalizar turno', danger: true });
        if (!okay) break;
        const r = Store.endShift();
        if (r.ok) location.hash = `#/historial/${r.shiftId}`; else report(r);
        break;
      }
      case 'open': location.hash = `#/actividad/${id}`; break;
      case 'inc': report(Store.adjustArrivals(id, 1)); break;
      case 'dec': report(Store.adjustArrivals(id, -1)); break;
      case 'set-count': {
        const v = Store.activityView(id);
        const n = await numberDialog({ title: `Tarimas de ${v.def.name}`, message: `¿Cuántas tarimas recibidas hay en total? (ya guardadas: ${v.A.processed || 0})`, value: v.received });
        if (n !== null) report(Store.setReceived(id, n));
        break;
      }
      case 'start': { const r = report(Store.startActivity(id)); if (r.ok) location.hash = '#/'; break; }
      case 'finish': { const r = report(Store.finishActivity(id)); if (r.ok) location.hash = '#/'; break; }
      case 'cancel': {
        const okay = await confirmDialog({ title: '¿Cancelar la actividad?', message: 'No se registrará su hora en el reporte; la cancelación queda en la bitácora.', confirmText: 'Cancelar actividad', danger: true });
        if (okay) { const r = report(Store.cancelActivity(id)); if (r.ok) location.hash = '#/'; }
        break;
      }
      case 'reopen': report(Store.reopenActivity(id)); break;
      case 'customer': report(Store.toggleCustomer()); break;
      case 'move-up': report(Store.moveActivity(id, -1)); break;
      case 'move-down': report(Store.moveActivity(id, 1)); break;
      case 'delete-activity': {
        const def = state.settings.activities.find((d) => d.id === id);
        const okay = await confirmDialog({ title: `¿Eliminar «${def ? def.name : ''}»?`, message: 'Se quita de la lista. Lo ya registrado en turnos y reportes se conserva.', confirmText: 'Eliminar', danger: true });
        if (okay) { const r = report(Store.deleteActivity(id)); if (r.ok) location.hash = '#/actividades'; }
        break;
      }
      case 'toggle-order': logNewestFirst = !logNewestFirst; render(); break;
      case 'export': case 'copy-report': await doExport(btn, action === 'copy-report'); break;
      default: break;
    }
  }

  async function doExport(btn, copyOnly) {
    let shift, events;
    if (btn.dataset.closed) { const d = await Store.loadClosedShift(btn.dataset.shift); if (!d) { toast('No se encontró el turno', 'bad'); return; } shift = d.shift; events = d.events; }
    else { shift = state.shift; events = state.events; }
    if (!shift) { toast('No hay turno para exportar', 'warn'); return; }
    if (copyOnly) {
      try { await navigator.clipboard.writeText(T.Export.buildTxt({ shift, events })); toast('Reporte copiado', 'ok'); } catch (_) { toast('No se pudo copiar; usa Exportar', 'warn'); }
      return;
    }
    const format = btn.dataset.format || 'txt';
    const res = await T.Export.exportShift({ shift, events, format });
    if (res.cancelled) return;
    if (!res.ok) { toast(`No se pudo exportar: ${res.error || 'error desconocido'}`, 'bad', 6000); return; }
    toast(`Exportado: ${res.filename}`, 'ok');
    if (!btn.dataset.closed) Store.logExport(format, res.filename);
  }

  function onSubmit(ev) {
    const form = ev.target;
    if (form.id === 'settings-form') {
      ev.preventDefault();
      const fd = new FormData(form);
      const r = Store.updateSettings({
        areaName: String(fd.get('area') || '').trim() || state.settings.areaName,
        categories: String(fd.get('cats') || '').split(',').map((x) => x.trim()).filter(Boolean),
      });
      if (r.ok) { toast('Ajustes guardados', 'ok'); location.hash = '#/'; }
    } else if (form.id === 'activity-form') {
      ev.preventDefault();
      const fd = new FormData(form);
      const r = Store.saveActivity({
        id: form.dataset.activityId, name: fd.get('name'), group: fd.get('group'), kind: fd.get('kind'),
        icon: fd.get('icon'), color: fd.get('color'), optional: fd.get('optional') === 'on',
        days: Config.DAY_LABELS.map(([n]) => n).filter((n) => fd.get(`day-${n}`) === 'on').map(Number),
      });
      if (r.ok) { toast('Actividad guardada', 'ok'); location.hash = '#/actividades'; } else toast(r.reason, 'warn');
    }
  }

  function init(el) {
    root = el;
    root.addEventListener('click', onClick);
    root.addEventListener('submit', onSubmit);
    global.addEventListener('hashchange', render);
    Store.subscribe(render);
    render();
  }

  T.UI = {
    init, render, updateLive,
    showBlocked() { mount(viewBlocked()); },
    showFatal(err) { mount(h('main', { class: 'screen' }, h('section', { class: 'panel' }, h('h1', {}, 'No se pudo iniciar'), h('p', {}, String((err && err.message) || err))))); },
  };
})(window);

/* Arranque: instancia única y ciclo de vida de la página. */
(function (global) {
  'use strict';
  const T = (global.Turnos = global.Turnos || {});

  function tryLock() {
    return new Promise((resolve) => {
      if (!navigator.locks || !navigator.locks.request) { resolve(true); return; }
      try {
        navigator.locks.request('turnos-single-instance', { ifAvailable: true }, (lock) => {
          resolve(!!lock);
          return lock ? new Promise(() => {}) : undefined;
        }).catch(() => resolve(true));
      } catch (_) { resolve(true); }
    });
  }
  async function acquireLock() {
    for (let i = 0; i < 3; i++) {
      if (await tryLock()) return true;
      await new Promise((r) => setTimeout(r, 600));
    }
    return false;
  }

  async function main() {
    T.UI.init(document.getElementById('app'));
    if (!(await acquireLock())) { T.UI.showBlocked(); return; }
    try { await T.Store.init(); } catch (err) { T.UI.showFatal(err); return; }
    setInterval(() => T.UI.updateLive(), 15000);
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('./sw.js').catch(() => {});
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { T.UI.updateLive(); T.UI.render(); } });
  }
  main();
})(window);
</script>
</body>
</html>
